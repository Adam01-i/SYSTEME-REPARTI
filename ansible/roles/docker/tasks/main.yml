# ansible/roles/docker/tasks/main.yml
- name: Remove old Jenkins repository if exists
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/jenkins.list
    state: absent

- name: Remove docker sources
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent

- name: Remove docker keyring
  ansible.builtin.file:
    path: /usr/share/keyrings/docker.gpg
    state: absent

- name: Download Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /tmp/docker.asc
    mode: '0644'

- name: Convert Docker key to gpg
  ansible.builtin.command:
    cmd: gpg --dearmor -o /usr/share/keyrings/docker.gpg /tmp/docker.asc
  args:
    creates: /usr/share/keyrings/docker.gpg

- name: Add Docker repository
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/usr/share/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    filename: docker
    state: present

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true

- name: Install Docker
  ansible.builtin.apt:
    name: docker-ce
    state: present

- name: Start Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
