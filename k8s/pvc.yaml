# k8s/pvc.yaml

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
      
volumeMounts:
  - mountPath: /var/lib/postgresql/data
    name: postgres-storage

volumes:
  - name: postgres-storage
    persistentVolumeClaim:
      claimName: postgres-pvc
